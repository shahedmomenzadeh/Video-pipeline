# Directory Configuration
directories:
  videos: "./videos"
  audio: "./audio"
  transcripts: "./transcripts"
  refined_transcripts: "./refined_transcripts"
  vlm_dataset: "./vlm_dataset"
  adverse_events: "./adverse_events"
  clips: "./clip_dataset"


# Files
files:
  metadata_csv: "video_metadata.csv"
  cookies: "www.youtube.com_cookies.txt"
  refinement_log: "refinement_log.csv"
  video_links: "videos_link.txt"
  dataset_summary: "dataset_info.csv"

# Download Settings
download:
  max_duration_seconds: 1500

# Transcription Settings
whisper:
  model_size: "large"
  device: "cuda" # or 'cpu'

# Refinement Settings
cerebras:
  model: "qwen-3-235b-a22b-instruct-2507"
  api_call_delay_seconds: 20
  max_files_per_run: 300

# VLM Dataset Generation Settings
vlm:
  gatekeeper_model: "gemini-2.0-flash" 
  generator_model: "gemini-2.5-pro" 
  aggregate_file: "vlm_dataset_all.jsonl"
  log_file: "process_log.csv"

# Adverse Event Detector Settings
adverse_event:
  model: "gemini-2.5-flash"
  aggregate_file: "adverse_events_all.jsonl"
  log_file: "adverse_event_log.csv"

# Splitter Settings
splitter:
  log_file: "split_log.csv"


# Dataset Formatter Settings (SFT & GRPO)
dataset_formatter:
  output_dir: "./training_datasets"
  model: "gemini-3-flash-preview"
  base_url: "https://api.gapgpt.app/v1"
  api_key: "sk-XoUOvScrI3I1MmPECjgxP0vUePTxLenGd9fydIgaJdMVruQD"
  log_file: "dataset_formatter_log.csv"
  split_file: "dataset_split.json"
  max_retries: 3
